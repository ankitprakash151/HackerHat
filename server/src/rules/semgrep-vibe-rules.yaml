rules:
  # ---------------------------------------------------------------------------
  # 1. Weak Password Hashing (MD5, SHA1, plaintext comparison)
  # ---------------------------------------------------------------------------
  - id: vibe-weak-password-hashing-md5
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      category: CRYPTO
      shortDescription: "Weak MD5 hashing detected for credentials"
    message: >-
      MD5 is cryptographically broken and prone to collision and rainbow table attacks.
      Use bcrypt (salt rounds >= 12) or argon2id for password storage.
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("md5")
          - pattern: crypto.createHash('md5')
          - pattern: CryptoJS.MD5(...)
          - pattern: md5(...)

  - id: vibe-weak-password-hashing-sha1
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      category: CRYPTO
      shortDescription: "Weak SHA1 hashing detected"
    message: >-
      SHA-1 is deprecated for secure password storage due to collision vulnerabilities.
      Migrate to bcrypt or argon2id.
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("sha1")
          - pattern: crypto.createHash('sha1')
          - pattern: CryptoJS.SHA1(...)
          - pattern: sha1(...)

  - id: vibe-plaintext-password-compare
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-256: Plaintext Storage of a Password"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: CRYPTO
      shortDescription: "Plaintext password comparison detected"
    message: >-
      User-supplied password is being compared directly against stored password using '===' or '=='.
      Passwords must be hashed with a slow, salted algorithm (bcrypt/argon2) and verified using constant-time comparison.
    patterns:
      - pattern-either:
          - pattern: $USER.password === $REQ.body.password
          - pattern: $USER.password == $REQ.body.password
          - pattern: $REQ.body.password === $USER.password

  # ---------------------------------------------------------------------------
  # 2. Missing Authentication Middleware on Sensitive Routes
  # ---------------------------------------------------------------------------
  - id: vibe-missing-auth-middleware-admin
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-306: Missing Authentication for Critical Function"
      owasp: "A01:2021 - Broken Access Control"
      category: AUTH_BYPASS
      shortDescription: "Sensitive administrative route lacks authentication middleware"
    message: >-
      Express route handler under '/api/admin' or administrative endpoint is defined
      without an authentication middleware (e.g., authenticate, verifyToken, requireAuth).
    patterns:
      - pattern-either:
          - pattern: $APP.get('/api/admin/$ROUTE', (req, res) => { ... })
          - pattern: $APP.post('/api/admin/$ROUTE', (req, res) => { ... })
          - pattern: $APP.delete('/api/admin/$ROUTE', (req, res) => { ... })
          - pattern: $APP.put('/api/admin/$ROUTE', (req, res) => { ... })
          - pattern: $APP.delete('/api/users/$ROUTE', (req, res) => { ... })
          - pattern: $ROUTER.delete('/users/:id', (req, res) => { ... })
          - pattern: $ROUTER.get('/admin/$ROUTE', (req, res) => { ... })

  # ---------------------------------------------------------------------------
  # 3. Weak JWT Configurations (none algorithm, hardcoded secret)
  # ---------------------------------------------------------------------------
  - id: vibe-weak-jwt-none-algorithm
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      category: CRYPTO
      shortDescription: "JWT configured with algorithm 'none'"
    message: >-
      JWT signing or verification specifies algorithm 'none', which disables signature
      integrity checks and allows attackers to forge administrative tokens.
    patterns:
      - pattern-either:
          - pattern: jwt.sign($PAYLOAD, $KEY, { ..., algorithm: 'none', ... })
          - pattern: jwt.verify($TOKEN, $KEY, { ..., algorithms: [..., 'none', ...], ... })

  - id: vibe-hardcoded-jwt-secret
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      category: SECRETS
      shortDescription: "Hardcoded secret string used in JWT signing"
    message: >-
      A literal string secret was found in jwt.sign or jwt.verify.
      Secrets must be loaded securely from environment variables (e.g., process.env.JWT_SECRET).
    patterns:
      - pattern-either:
          - pattern: jwt.sign($PAYLOAD, "secret", ...)
          - pattern: jwt.sign($PAYLOAD, 'secret', ...)
          - pattern: jwt.sign($PAYLOAD, "mysecret", ...)
          - pattern: jwt.sign($PAYLOAD, 'mysecret', ...)
          - pattern: jwt.sign($PAYLOAD, "123456", ...)
          - pattern: jwt.sign($PAYLOAD, "jwtsecret", ...)
          - pattern: jwt.verify($TOKEN, "secret", ...)
          - pattern: jwt.verify($TOKEN, 'secret', ...)

  # ---------------------------------------------------------------------------
  # 4. Exposed Sensitive Files & Debug/Backdoor Routes
  # ---------------------------------------------------------------------------
  - id: vibe-exposed-env-dump-route
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp: "A05:2021 - Security Misconfiguration"
      category: EXPOSED_FILES
      shortDescription: "Route handler exposes environment variables (process.env)"
    message: >-
      Endpoint returns process.env directly to the client. This will leak all API keys,
      database credentials, and JWT secrets.
    patterns:
      - pattern-either:
          - pattern: res.json(process.env)
          - pattern: res.send(process.env)
          - pattern: res.json({ ..., env: process.env, ... })

  - id: vibe-debug-backdoor-route
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-489: Active Debug Code in Production"
      owasp: "A05:2021 - Security Misconfiguration"
      category: EXPOSED_FILES
      shortDescription: "Active debug or backdoor endpoint detected"
    message: >-
      Detected debug or test route (e.g. /debug, /backdoor, /test-reset) that could be
      exploited if exposed in production.
    patterns:
      - pattern-either:
          - pattern: $APP.get('/debug', ...)
          - pattern: $APP.get('/debug/vars', ...)
          - pattern: $APP.all('/test-backdoor', ...)
          - pattern: $APP.post('/admin/reset-database', ...)
